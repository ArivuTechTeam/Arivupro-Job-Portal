<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ArivuPro Finance Career Portal — Prototype</title>
<style>
  :root {
    --bg: #0a0f1e;
    --surface: #111827;
    --surface2: #1a2234;
    --border: #1f2d45;
    --amber: #f59e0b;
    --amber2: #fbbf24;
    --green: #10b981;
    --red: #ef4444;
    --blue: #3b82f6;
    --purple: #8b5cf6;
    --text: #f1f5f9;
    --muted: #64748b;
    --muted2: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .hidden { display: none !important; }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: var(--bg); } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── LOGIN PAGE ── */
  #login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(ellipse at 20% 50%, #1a1040 0%, var(--bg) 60%); }
  .login-wrap { width: 100%; max-width: 440px; }
  .login-logo { text-align: center; margin-bottom: 32px; }
  .login-logo .badge { display: inline-flex; align-items: center; gap: 10px; }
  .logo-icon { width: 42px; height: 42px; background: var(--amber); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; color: #0a0f1e; }
  .logo-name { font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: -0.5px; }
  .login-logo p { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px; }
  .login-card h2 { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
  .role-tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 24px; background: var(--bg); border-radius: 10px; padding: 4px; }
  .role-tab { padding: 8px 4px; text-align: center; border-radius: 7px; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--muted); border: none; background: none; transition: all .2s; }
  .role-tab.active { background: var(--surface2); color: var(--amber); }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 12px; color: var(--muted2); margin-bottom: 6px; font-weight: 500; }
  .form-group input, .form-group select { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 14px; outline: none; transition: border .2s; }
  .form-group input:focus, .form-group select:focus { border-color: var(--amber); }
  .form-group input::placeholder { color: var(--muted); }
  .btn-primary { width: 100%; background: var(--amber); color: #0a0f1e; font-weight: 700; border: none; border-radius: 8px; padding: 11px; font-size: 14px; cursor: pointer; transition: background .2s; }
  .btn-primary:hover { background: var(--amber2); }
  .login-hint { text-align: center; margin-top: 16px; font-size: 12px; color: var(--muted); }
  .demo-creds { margin-top: 20px; background: var(--surface2); border-radius: 10px; padding: 14px; }
  .demo-creds p { font-size: 11px; color: var(--muted); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
  .demo-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted2); padding: 3px 0; }
  .demo-row span:last-child { color: var(--amber); font-weight: 600; }

  /* ── APP SHELL ── */
  #app { display: none; min-height: 100vh; }
  .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .topbar-logo { display: flex; align-items: center; gap: 8px; }
  .topbar-logo .logo-icon { width: 32px; height: 32px; font-size: 14px; border-radius: 7px; }
  .topbar-logo span { font-weight: 800; font-size: 15px; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .user-chip { display: flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px 5px 5px; }
  .user-avatar { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
  .user-chip span { font-size: 12px; font-weight: 600; }
  .role-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; text-transform: uppercase; letter-spacing: .4px; }
  .role-badge.student { background: #1e3a5f; color: var(--blue); }
  .role-badge.recruiter { background: #1a3a2a; color: var(--green); }
  .role-badge.admin { background: #3a1a2a; color: #f472b6; }
  .btn-logout { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 7px; padding: 5px 12px; font-size: 12px; cursor: pointer; transition: all .2s; }
  .btn-logout:hover { border-color: var(--red); color: var(--red); }

  /* ── LAYOUT ── */
  .layout { display: flex; min-height: calc(100vh - 56px); }
  .sidebar { width: 220px; background: var(--surface); border-right: 1px solid var(--border); padding: 16px 12px; flex-shrink: 0; }
  .sidebar-section { margin-bottom: 24px; }
  .sidebar-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; padding: 0 8px; margin-bottom: 8px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted2); transition: all .2s; border: none; background: none; width: 100%; text-align: left; }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: rgba(245,158,11,.12); color: var(--amber); }
  .nav-item .icon { font-size: 15px; width: 18px; text-align: center; }
  .nav-badge { margin-left: auto; background: var(--amber); color: #0a0f1e; font-size: 10px; font-weight: 700; border-radius: 10px; padding: 1px 6px; }
  .main { flex: 1; padding: 28px; overflow-y: auto; }

  /* ── PAGE HEADER ── */
  .page-header { margin-bottom: 24px; }
  .page-header h1 { font-size: 22px; font-weight: 800; letter-spacing: -.3px; }
  .page-header p { color: var(--muted2); font-size: 13px; margin-top: 4px; }
  .page-title-row { display: flex; align-items: center; justify-content: space-between; }

  /* ── STAT CARDS ── */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  .stat-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }
  .stat-value { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
  .stat-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .stat-card.amber .stat-value { color: var(--amber); }
  .stat-card.green .stat-value { color: var(--green); }
  .stat-card.blue .stat-value { color: var(--blue); }
  .stat-card.purple .stat-value { color: var(--purple); }

  /* ── CARDS / PANELS ── */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .card-title { font-size: 14px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
  .card-title span { font-size: 12px; color: var(--muted); font-weight: 400; }

  /* ── JOB CARDS ── */
  .job-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .job-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; cursor: pointer; transition: border-color .2s, transform .15s; }
  .job-card:hover { border-color: var(--amber); transform: translateY(-1px); }
  .job-card-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
  .co-logo { width: 40px; height: 40px; border-radius: 8px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px; color: var(--amber); border: 1px solid var(--border); flex-shrink: 0; }
  .job-title { font-size: 14px; font-weight: 700; line-height: 1.3; }
  .job-company { font-size: 12px; color: var(--muted2); margin-top: 2px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tag { font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 6px; }
  .tag.type { background: #1e3a5f; color: var(--blue); }
  .tag.loc { background: var(--surface2); color: var(--muted2); }
  .tag.qual { background: rgba(245,158,11,.12); color: var(--amber); }
  .tag.urgent { background: rgba(239,68,68,.15); color: var(--red); }
  .tag.exclusive { background: rgba(139,92,246,.15); color: var(--purple); }
  .tag.source { background: var(--surface2); color: var(--muted); }
  .job-salary { font-size: 13px; font-weight: 700; color: var(--green); }
  .job-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .job-meta-info { font-size: 11px; color: var(--muted); }
  .match-pill { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
  .match-pill.excellent { background: rgba(16,185,129,.15); color: var(--green); }
  .match-pill.strong { background: rgba(59,130,246,.15); color: var(--blue); }
  .apply-btn { margin-top: 12px; width: 100%; background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.3); color: var(--amber); border-radius: 8px; padding: 8px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all .2s; }
  .apply-btn:hover { background: var(--amber); color: #0a0f1e; }

  /* ── FILTER BAR ── */
  .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .filter-select { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 12px; font-size: 12px; outline: none; cursor: pointer; }
  .search-input { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 12px; font-size: 12px; outline: none; flex: 1; min-width: 200px; }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus, .filter-select:focus { border-color: var(--amber); }

  /* ── PIPELINE / TRACKER ── */
  .pipeline { display: flex; gap: 0; margin-bottom: 20px; overflow-x: auto; }
  .pipeline-stage { flex: 1; min-width: 110px; text-align: center; padding: 10px 8px; position: relative; }
  .pipeline-stage::after { content: '→'; position: absolute; right: -6px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 12px; z-index: 1; }
  .pipeline-stage:last-child::after { display: none; }
  .ps-dot { width: 28px; height: 28px; border-radius: 50%; margin: 0 auto 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
  .ps-dot.done { background: rgba(16,185,129,.2); color: var(--green); border: 2px solid var(--green); }
  .ps-dot.active { background: rgba(245,158,11,.2); color: var(--amber); border: 2px solid var(--amber); }
  .ps-dot.pending { background: var(--surface2); color: var(--muted); border: 2px solid var(--border); }
  .ps-label { font-size: 10px; color: var(--muted2); font-weight: 500; }

  /* ── TABLE ── */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  td { padding: 12px 12px; font-size: 13px; border-bottom: 1px solid rgba(31,45,69,.5); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,.02); }
  .status-pill { display: inline-block; font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px; text-transform: capitalize; }
  .status-pill.applied { background: rgba(59,130,246,.15); color: var(--blue); }
  .status-pill.review { background: rgba(245,158,11,.15); color: var(--amber); }
  .status-pill.interview { background: rgba(139,92,246,.15); color: var(--purple); }
  .status-pill.offer { background: rgba(16,185,129,.15); color: var(--green); }
  .status-pill.placed { background: rgba(16,185,129,.25); color: #34d399; }
  .status-pill.declined { background: rgba(239,68,68,.15); color: var(--red); }
  .status-pill.active { background: rgba(16,185,129,.15); color: var(--green); }
  .status-pill.draft { background: var(--surface2); color: var(--muted); }
  .status-pill.pending { background: rgba(245,158,11,.12); color: var(--amber); }
  .status-pill.verified { background: rgba(16,185,129,.15); color: var(--green); }
  .status-pill.new { background: rgba(59,130,246,.15); color: var(--blue); }

  /* ── SCRAPER ── */
  .scraper-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .scraper-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .scraper-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .scraper-name { font-size: 13px; font-weight: 700; }
  .scraper-dot { width: 8px; height: 8px; border-radius: 50%; }
  .scraper-dot.active { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .scraper-dot.idle { background: var(--muted); }
  .scraper-dot.running { background: var(--amber); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.4} }
  .scraper-meta { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
  .scraper-count { font-size: 20px; font-weight: 800; color: var(--amber); }
  .trigger-btn { margin-top: 10px; width: 100%; background: none; border: 1px solid var(--border); color: var(--muted2); border-radius: 7px; padding: 6px; font-size: 11px; cursor: pointer; transition: all .2s; }
  .trigger-btn:hover { border-color: var(--amber); color: var(--amber); }

  /* ── DB SCHEMA VIEW ── */
  .schema-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .schema-table { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .schema-table-header { background: var(--surface2); padding: 12px 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
  .schema-table-header .table-icon { font-size: 14px; }
  .schema-table-header .table-name { font-size: 13px; font-weight: 700; }
  .schema-table-header .table-desc { font-size: 11px; color: var(--muted); margin-left: auto; }
  .schema-col { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid rgba(31,45,69,.4); font-size: 12px; }
  .schema-col:last-child { border-bottom: none; }
  .col-name { font-weight: 600; color: var(--text); min-width: 160px; font-family: 'Courier New', monospace; font-size: 11px; }
  .col-type { color: var(--blue); font-size: 10px; font-family: monospace; min-width: 100px; }
  .col-note { color: var(--muted); font-size: 10px; }
  .pk { color: var(--amber); font-size: 10px; font-weight: 700; margin-left: auto; }

  /* ── TECH STACK ── */
  .tech-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .tech-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; text-align: center; }
  .tech-icon { font-size: 28px; margin-bottom: 8px; }
  .tech-name { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .tech-desc { font-size: 11px; color: var(--muted); line-height: 1.4; }
  .tech-layer { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; padding: 2px 7px; border-radius: 6px; display: inline-block; margin-bottom: 8px; }
  .tech-layer.fe { background: rgba(59,130,246,.15); color: var(--blue); }
  .tech-layer.be { background: rgba(16,185,129,.15); color: var(--green); }
  .tech-layer.db { background: rgba(245,158,11,.15); color: var(--amber); }
  .tech-layer.ai { background: rgba(139,92,246,.15); color: var(--purple); }
  .tech-layer.infra { background: rgba(239,68,68,.15); color: var(--red); }

  /* ── FLOW DIAGRAM ── */
  .flow { display: flex; align-items: center; gap: 0; overflow-x: auto; padding: 20px 0; }
  .flow-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; min-width: 130px; text-align: center; flex-shrink: 0; }
  .flow-box .fb-icon { font-size: 22px; margin-bottom: 6px; }
  .flow-box .fb-title { font-size: 12px; font-weight: 700; }
  .flow-box .fb-sub { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .flow-arrow { color: var(--amber); font-size: 20px; padding: 0 8px; flex-shrink: 0; }
  .flow-box.highlight { border-color: var(--amber); background: rgba(245,158,11,.08); }

  /* ── TOAST ── */
  #toast { position: fixed; bottom: 24px; right: 24px; background: var(--green); color: white; padding: 12px 20px; border-radius: 10px; font-size: 13px; font-weight: 600; z-index: 9999; transition: opacity .3s; opacity: 0; pointer-events: none; }
  #toast.show { opacity: 1; }

  /* ── MODAL ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px; width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; }
  .modal h3 { font-size: 17px; font-weight: 800; margin-bottom: 20px; }
  .modal-close { float: right; background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1; }

  /* ── TIMELINE ── */
  .timeline { padding-left: 20px; }
  .tl-item { position: relative; padding: 0 0 16px 20px; border-left: 2px solid var(--border); }
  .tl-item:last-child { border-left-color: transparent; padding-bottom: 0; }
  .tl-dot { position: absolute; left: -7px; top: 0; width: 12px; height: 12px; border-radius: 50%; background: var(--amber); border: 2px solid var(--bg); }
  .tl-dot.done { background: var(--green); }
  .tl-stage { font-size: 12px; font-weight: 700; color: var(--text); }
  .tl-time { font-size: 11px; color: var(--muted); }
  .tl-note { font-size: 11px; color: var(--muted2); margin-top: 2px; }

  /* ── AI MATCH ── */
  .match-bar-wrap { margin-bottom: 10px; }
  .match-bar-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted2); margin-bottom: 4px; }
  .match-bar { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
  .match-bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--amber), var(--green)); }

  /* ── RECRUITER ── */
  .job-post-form .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .btn-secondary { background: none; border: 1px solid var(--amber); color: var(--amber); border-radius: 8px; padding: 8px 16px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all .2s; }
  .btn-secondary:hover { background: rgba(245,158,11,.1); }
  .btn-sm { padding: 5px 12px; font-size: 11px; border-radius: 6px; font-weight: 600; border: none; cursor: pointer; }
  .btn-sm.green { background: rgba(16,185,129,.15); color: var(--green); }
  .btn-sm.red { background: rgba(239,68,68,.15); color: var(--red); }
  .btn-sm.blue { background: rgba(59,130,246,.15); color: var(--blue); }

  /* ── ADMIN ── */
  .admin-tabs { display: flex; gap: 4px; margin-bottom: 24px; background: var(--surface2); border-radius: 10px; padding: 4px; border: 1px solid var(--border); }
  .admin-tab { flex: 1; padding: 8px; text-align: center; border-radius: 7px; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--muted); border: none; background: none; transition: all .2s; }
  .admin-tab.active { background: var(--surface); color: var(--amber); }
  .alert-row { display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--surface2); border-radius: 8px; margin-bottom: 8px; border-left: 3px solid var(--amber); }
  .alert-row .ar-icon { font-size: 16px; }
  .alert-row .ar-text { font-size: 12px; color: var(--muted2); flex: 1; }
  .alert-row .ar-time { font-size: 11px; color: var(--muted); }

  /* ── PROFILE ── */
  .profile-header { display: flex; align-items: center; gap: 20px; padding: 20px; background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 20px; }
  .profile-avatar { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; border: 3px solid var(--amber); }
  .profile-name { font-size: 18px; font-weight: 800; }
  .profile-sub { font-size: 12px; color: var(--muted2); margin-top: 2px; }
  .profile-badges { display: flex; gap: 6px; margin-top: 8px; }
  .skill-chip { display: inline-block; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; font-size: 11px; color: var(--muted2); margin: 3px; }

  /* ── RESPONSIVE ── */

  </div>
  <div class="job-grid" id="job-grid">${renderJobCards(JOBS)}</div>`;
}

function renderJobCards(jobs) {
  return jobs.map(j => `
  <div class="job-card" onclick="openJobModal('${j.id}')">
    <div class="job-card-top">
      <div class="co-logo">${j.logo}</div>
      <div>
        <div class="job-title">${j.title}</div>
        <div class="job-company">${j.company}</div>
      </div>
    </div>
    <div class="tags">
      ${j.exclusive ? '<span class="tag exclusive">⭐ ArivuPro Exclusive</span>' : ''}
      ${j.urgent ? '<span class="tag urgent">🔥 Urgent</span>' : ''}
      <span class="tag type">${j.type}</span>
      <span class="tag loc">📍 ${j.location}</span>
      <span class="tag loc">🏠 ${j.workplace}</span>
      ${j.quals.map(q => `<span class="tag qual">${q}</span>`).join('')}
    </div>
    <div class="job-salary">${j.salary}</div>
    <div class="job-meta">
      <span class="job-meta-info">👥 ${j.applicants} applicants · 📅 ${j.posted}</span>
      <span class="match-pill ${j.matchGrade.toLowerCase()}">${j.matchScore}% Match</span>
    </div>
    <button class="apply-btn" onclick="event.stopPropagation();applyJob('${j.id}')">Apply via ArivuPro →</button>
  </div>`).join('');
}

function filterJobs() {
  const q = document.getElementById('job-search')?.value.toLowerCase() || '';
  const type = document.getElementById('f-type')?.value || '';
  const city = document.getElementById('f-city')?.value || '';
  const qual = document.getElementById('f-qual')?.value || '';
  const filtered = JOBS.filter(j =>
    (!q || j.title.toLowerCase().includes(q) || j.company.toLowerCase().includes(q) || j.skills.some(s => s.toLowerCase().includes(q))) &&
    (!type || j.type.includes(type)) &&
    (!city || j.city === city) &&
    (!qual || j.quals.includes(qual))
  );
  const grid = document.getElementById('job-grid');
  if (grid) grid.innerHTML = filtered.length ? renderJobCards(filtered) : '<p style="color:var(--muted);padding:40px;text-align:center">No jobs match your filters.</p>';
}

function applyJob(jobId) {
  const job = JOBS.find(j => j.id === jobId);
  if (!job) return;
  APPLICATIONS.push({ id:'a'+Date.now(), jobId, jobTitle:job.title, company:job.company, appliedDate:'Today', stage:'Applied', score:job.matchScore, grade:job.matchGrade, counselor:'ArivuPro Placement Desk', interviewDate:'', timeline:[{s:'Applied',t:'Just now',n:'Submitted via ArivuPro Portal'}] });
  showToast(`✅ Applied to ${job.title} at ${job.company}`);
}

  const stages = ['Applied','ArivuPro Review','Recruiter Screen','Technical Round','Partner Interview','Offer Released','Placed'];
  return `
  <div class="page-header"><h1>My Applications</h1><p>Track your placement pipeline in real-time</p></div>
  <div class="card">
    <div class="card-title">Application Pipeline <span>${APPLICATIONS.length} active</span></div>
    <div class="pipeline">
      ${stages.map((s,i) => {
        const hasApp = APPLICATIONS.some(a => a.stage === s);
        const done = APPLICATIONS.some(a => stages.indexOf(a.stage) > i);
        const cls = hasApp ? 'active' : done ? 'done' : 'pending';
        return `<div class="pipeline-stage"><div class="ps-dot ${cls}">${hasApp?'●':done?'✓':'○'}</div><div class="ps-label">${s}</div></div>`;
      }).join('')}
    </div>
  </div>
  ${APPLICATIONS.map(a => `

    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px">

        <div style="font-size:15px;font-weight:700">${a.jobTitle}</div>

    {layer:'fe',icon:'⚛️',name:'React 19',desc:'SPA with hooks, context, and tab-based routing'},

    {layer:'be',icon:'🐍',name:'Python / FastAPI',desc:'Async REST API, Pydantic validation, auto Swagger docs'},
    {layer:'be',icon:'🦄',name:'Uvicorn',desc:'ASGI server — production-grade Python web runtime'},
    {layer:'be',icon:'🔌',name:'Supabase SDK',desc:'Python client for DB queries & Storage uploads'},
    {layer:'db',icon:'🐘',name:'PostgreSQL',desc:'Primary database via Supabase — 6 tables, RLS enabled'},
    {layer:'db',icon:'🔐',name:'Row Level Security',desc:'Policy-based access: public read active jobs only'},
    {layer:'db',icon:'🪣',name:'Supabase Storage',desc:'3 buckets: resumes (private), job-logos, job-docs'},

    {layer:'ai',icon:'🧠',name:'Course Detection',desc:'Keyword regex (80+ patterns) → Gemini fallback for NLP'},

  const layerLabels = {fe:'Frontend',be:'Backend',db:'Database',ai:'AI / ML',infra:'Infrastructure'};

  return `

  ${layers.map(l => `
  <div class="card">
    <div class="card-title">${layerLabels[l]}</div>
    <div class="tech-grid">
      ${stack.filter(s => s.layer===l).map(s => `
      <div class="tech-card">

}

function openJobModal(jobId) {
  const job = JOBS.find(j => j.id === jobId);
  if (!job) return;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
  <div class="modal">
    <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
    <div style="display:flex;gap:12px;align-items:flex-start;margin-bottom:20px">
      <div class="co-logo" style="width:52px;height:52px;font-size:16px">${job.logo}</div>
      <div>
        <h3 style="margin-bottom:4px">${job.title}</h3>
        <div style="font-size:13px;color:var(--muted2)">${job.company} · ${job.location} · ${job.workplace}</div>
        <div class="tags" style="margin-top:8px">
          ${job.exclusive?'<span class="tag exclusive">⭐ ArivuPro Exclusive</span>':''}
          <span class="tag type">${job.type}</span>
          ${job.quals.map(q=>`<span class="tag qual">${q}</span>`).join('')}
        </div>
      </div>
    </div>
    <div style="font-size:22px;font-weight:800;color:var(--green);margin-bottom:16px">${job.salary}</div>
    <p style="font-size:13px;color:var(--muted2);line-height:1.6;margin-bottom:20px">${job.desc}</p>
    <div style="margin-bottom:16px">
      <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:8px">Required Skills</div>
      <div>${job.skills.map(s=>`<span class="skill-chip">${s}</span>`).join('')}</div>
    </div>
    <div class="card-title" style="margin-bottom:12px">Your AI Match Score</div>
    <div style="text-align:center;padding:12px 0 16px">
      <div style="font-size:40px;font-weight:900;color:var(--${job.matchGrade==='Excellent'?'green':'amber'})">${job.matchScore}%</div>
      <span class="match-pill ${job.matchGrade.toLowerCase()}" style="font-size:12px">${job.matchGrade}</span>
    </div>
    <button class="btn-primary" onclick="applyJob('${job.id}');this.closest('.modal-overlay').remove()">Apply via ArivuPro →</button>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
